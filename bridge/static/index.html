<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monitor Mix</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #14161a;
    color: #eee;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem;
    background: #1d2026;
    border-left: 6px solid transparent;
    position: sticky;
    top: 0;
  }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  button.back, button.lock {
    background: none;
    border: 1px solid #444;
    color: #eee;
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    font-size: 1rem;
  }
  button.lock { min-width: 7.5rem; }
  button.lock.unlocked { background: #e8a33d; border-color: #e8a33d; color: #111; font-weight: 600; }
  button.lock.nudge { animation: nudge 0.5s ease-in-out 2; }
  @keyframes nudge {
    0%, 100% { transform: none; }
    25% { transform: translateX(-5px); border-color: #e8a33d; }
    75% { transform: translateX(5px); border-color: #e8a33d; }
  }
  #status { padding: 0.5rem 1rem; color: #888; font-size: 0.85rem; }
  #trackList { list-style: none; margin: 0; padding: 0.5rem; }
  #trackList li button {
    width: 100%;
    text-align: left;
    padding: 1rem;
    margin: 0.25rem 0;
    font-size: 1.1rem;
    background: #22262e;
    color: #eee;
    border: none;
    border-radius: 10px;
  }
  #trackList li button:active { background: #2c313b; }
  #receives { padding: 0.5rem 1rem; }
  .receive-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.25rem 1rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid #262a31;
  }
  .receive-row .name { font-size: 1rem; grid-column: 1; }
  .receive-row .value { font-size: 0.85rem; color: #9aa; grid-column: 2; text-align: right; }
  /* Custom fader rather than <input type=range>: mobile browsers only start
     a range drag when the touch lands right on its small thumb. */
  .fader {
    grid-column: 1 / span 2;
    height: 3.5rem;
    padding: 0 1.25rem;  /* room for the thumb at either end */
    touch-action: pan-y;  /* locked: vertical swipes scroll the page */
    user-select: none;
    -webkit-user-select: none;
  }
  body.unlocked .fader { touch-action: none; }  /* unlocked: every touch drags */
  .fader .rail { position: relative; height: 100%; }
  .fader .groove, .fader .fill {
    position: absolute; left: 0; top: 50%; height: 0.6rem; margin-top: -0.3rem; border-radius: 0.3rem;
  }
  .fader .groove { right: 0; background: #333a45; }
  .fader .fill { background: #5aa9ff; }
  .fader .thumb {
    position: absolute; top: 50%;
    width: 2.5rem; height: 2.5rem; margin: -1.25rem 0 0 -1.25rem;
    border-radius: 50%;
    background: #e6e9ef;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    transition: transform 0.1s;
  }
  .fader.dragging .thumb { transform: scale(1.15); background: #fff; }
  body:not(.unlocked) .fader { opacity: 0.4; }
  body:not(.unlocked) .fader .fill { background: #8a96a8; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <button class="back" id="backBtn" hidden>&larr;</button>
  <h1 id="title">Monitor Mix</h1>
  <button class="lock" id="lockBtn" hidden aria-pressed="false"></button>
</header>
<div id="status"></div>

<ul id="trackList"></ul>

<div id="receives" hidden>
  <div id="receiveRows"></div>
</div>

<script>
(function () {
  "use strict";

  // Which track's receives this phone shows is this phone's own choice (kept
  // in the URL hash, so it survives reloads and the phone's back gesture
  // returns to the track list) -- never REAPER's selection.
  var state = { tracks: [], receives: {}, view: null }; // receives: track index -> [..]
  var interacting = new Set();
  var connected = false;

  var trackListEl = document.getElementById("trackList");
  var receivesEl = document.getElementById("receives");
  var receiveRowsEl = document.getElementById("receiveRows");
  var titleEl = document.getElementById("title");
  var backBtn = document.getElementById("backBtn");
  var statusEl = document.getElementById("status");
  var headerEl = document.querySelector("header");
  var lockBtn = document.getElementById("lockBtn");

  // Sliders start locked (and re-lock on every track change), so scrolling
  // or a stray touch can't change anyone's monitor level by accident.
  var locked = true;

  function setLocked(value) {
    locked = value;
    document.body.classList.toggle("unlocked", !locked);
    lockBtn.classList.toggle("unlocked", !locked);
    lockBtn.setAttribute("aria-pressed", String(!locked));
    lockBtn.textContent = locked ? "\uD83D\uDD12 Locked" : "\uD83D\uDD13 Unlocked";
  }

  lockBtn.addEventListener("click", function () {
    setLocked(!locked);
    render(); // clears any "sliders are locked" hint
  });

  function nudgeLock() {
    statusEl.textContent = "Sliders are locked \u2013 tap the lock button to unlock.";
    lockBtn.classList.remove("nudge");
    void lockBtn.offsetWidth; // restart the animation
    lockBtn.classList.add("nudge");
  }

  function findTrack(index) {
    return state.tracks.find(function (t) { return t.index === index; });
  }

  function trackName(index) {
    var t = findTrack(index);
    return t ? t.name : ("Track " + index);
  }

  // Simple WCAG-ish relative luminance: pick readable text for a track's own color.
  function readableTextColor(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    var luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return luminance > 0.5 ? "#111" : "#eee";
  }

  function setStatus(text) {
    statusEl.textContent = connected ? text
      : lastMessageAt ? "Disconnected from bridge, reconnecting..." : "Connecting...";
  }

  function render() {
    var onFaders = state.view !== null;
    trackListEl.hidden = onFaders;
    receivesEl.hidden = !onFaders;
    backBtn.hidden = !onFaders;
    lockBtn.hidden = !onFaders;
    titleEl.textContent = onFaders ? trackName(state.view) : "Monitor Mix";

    var viewedTrack = onFaders ? findTrack(state.view) : null;
    headerEl.style.borderLeftColor = (viewedTrack && viewedTrack.color) || "transparent";

    if (!onFaders) {
      trackListEl.innerHTML = "";
      // Only tracks with receives (e.g. monitor buses) have anything to ride here.
      var mixTracks = state.tracks.filter(function (t) {
        return (state.receives[t.index] || []).length > 0;
      });
      mixTracks.forEach(function (t) {
        var li = document.createElement("li");
        var btn = document.createElement("button");
        btn.textContent = t.name;
        if (t.color) {
          btn.style.background = t.color;
          btn.style.color = readableTextColor(t.color);
        }
        btn.addEventListener("click", function () { location.hash = String(t.index); });
        li.appendChild(btn);
        trackListEl.appendChild(li);
      });
      setStatus(mixTracks.length === 0 ? "Waiting for tracks with receives from REAPER..." : "");
      return;
    }

    var track = state.view;
    var receives = state.receives[track] || [];
    setStatus(receives.length === 0 ? "No receives on this track (yet)." : "");

    receives.forEach(function (r) {
      var row = receiveRowsEl.querySelector('[data-index="' + r.index + '"]');
      if (!row) {
        row = document.createElement("div");
        row.className = "receive-row";
        row.dataset.index = r.index;
        row.innerHTML =
          '<div class="name"></div><div class="value"></div>' +
          '<div class="fader" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="1">' +
          '<div class="rail"><div class="groove"></div><div class="fill"></div><div class="thumb"></div></div></div>';
        setupFader(row, track, r.index);
        receiveRowsEl.appendChild(row);
      }
      row.querySelector(".name").textContent = r.name || ("Receive " + r.index);
      row.querySelector(".fader").setAttribute("aria-label", r.name || ("Receive " + r.index));
      row.querySelector(".value").textContent = r.volume_str || "";
      if (!interacting.has(r.index)) {
        setFaderValue(row, r.volume);
      }
    });

    // Drop rows for receives that disappeared.
    Array.prototype.slice.call(receiveRowsEl.children).forEach(function (row) {
      var idx = parseInt(row.dataset.index, 10);
      if (!receives.some(function (r) { return r.index === idx; })) {
        row.remove();
      }
    });
  }

  function setFaderValue(row, value) {
    row.faderValue = value;
    var pct = (value * 100) + "%";
    row.querySelector(".fill").style.width = pct;
    row.querySelector(".thumb").style.left = pct;
    var fader = row.querySelector(".fader");
    fader.setAttribute("aria-valuenow", value.toFixed(3));
    fader.setAttribute("aria-valuetext", row.querySelector(".value").textContent);
  }

  // Grab anywhere on the fader's full height and width, then drag: the level
  // moves by how far the finger moves, never jumping to where it landed, so
  // catching the fader can't cause a sudden level change.
  function setupFader(row, track, index) {
    var fader = row.querySelector(".fader");
    var rail = row.querySelector(".rail");
    var drag = null;
    var releaseTimer = null;

    function change(value) {
      value = Math.max(0, Math.min(1, value));
      setFaderValue(row, value);
      sendVolume(track, index, value);
    }

    function release() {
      // Hold off on adopting REAPER's value briefly, so feedback for values
      // sent mid-drag can't flick the fader back after release.
      clearTimeout(releaseTimer);
      releaseTimer = setTimeout(function () { interacting.delete(index); render(); }, 500);
    }

    fader.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      if (locked) {
        // A tap (not a scroll, which cancels the pointer) on a locked fader.
        drag = { id: e.pointerId, lockedTap: true };
        return;
      }
      e.preventDefault();
      fader.setPointerCapture(e.pointerId);
      clearTimeout(releaseTimer);
      interacting.add(index);
      fader.classList.add("dragging");
      drag = { id: e.pointerId, startX: e.clientX, startValue: row.faderValue || 0,
               width: rail.getBoundingClientRect().width || 1 };
    });

    fader.addEventListener("pointermove", function (e) {
      if (!drag || drag.lockedTap || e.pointerId !== drag.id) return;
      change(drag.startValue + (e.clientX - drag.startX) / drag.width);
    });

    function end(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var wasTap = drag.lockedTap && e.type === "pointerup";
      var wasDrag = !drag.lockedTap;
      drag = null;
      if (wasTap) nudgeLock();
      if (wasDrag) {
        fader.classList.remove("dragging");
        sendVolume(track, index, row.faderValue);
        release();
      }
    }
    fader.addEventListener("pointerup", end);
    fader.addEventListener("pointercancel", end);
    fader.addEventListener("lostpointercapture", end);

    fader.addEventListener("keydown", function (e) {
      var step = { ArrowLeft: -0.01, ArrowDown: -0.01, ArrowRight: 0.01, ArrowUp: 0.01 }[e.key];
      if (step === undefined) return;
      e.preventDefault();
      if (locked) { nudgeLock(); return; }
      clearTimeout(releaseTimer);
      interacting.add(index);
      change((row.faderValue || 0) + step);
      release();
    });
  }

  // At most one request in flight per receive, always carrying the latest
  // value: parallel requests could reach the bridge out of order and leave
  // REAPER at an older level than where the slider was released.
  var pendingVolume = new Map();
  var inFlight = new Set();

  function sendVolume(track, index, value) {
    var key = track + "/" + index;
    pendingVolume.set(key, { track: track, index: index, value: value });
    if (!inFlight.has(key)) flushVolume(key);
  }

  function flushVolume(key) {
    var body = pendingVolume.get(key);
    pendingVolume.delete(key);
    inFlight.add(key);
    fetch("/api/receive/volume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).catch(function () {
      // Bridge unreachable -- the event stream's reconnect logic reports it.
    }).then(function () {
      inFlight.delete(key);
      if (pendingVolume.has(key)) flushVolume(key);
    });
  }

  function showView() {
    var n = parseInt(location.hash.slice(1), 10);
    var view = isNaN(n) ? null : n;
    if (view !== state.view) {
      state.view = view;
      setLocked(true);
      interacting.clear();
      receiveRowsEl.innerHTML = "";
    }
    render();
  }

  backBtn.addEventListener("click", function () {
    history.replaceState(null, "", location.pathname);
    showView();
  });
  window.addEventListener("hashchange", showView);

  // EventSource retries on its own, but not reliably after a phone sleeps or
  // switches networks -- so also watch for silence (the bridge sends a ping
  // at least every 10s) and reconnect from scratch.
  var STALE_MS = 25000;
  var es = null;
  var lastMessageAt = 0;

  function connect() {
    if (es) es.close();
    if (lastMessageAt) lastMessageAt = Date.now(); // restart the stale timer, not on first connect
    es = new EventSource("/api/events");
    es.onopen = function () {
      connected = true;
      render();
    };
    es.onmessage = function (ev) {
      lastMessageAt = Date.now();
      connected = true;
      var msg = JSON.parse(ev.data);
      if (msg.type === "tracks") state.tracks = msg.tracks;
      else if (msg.type === "receives") state.receives[msg.track] = msg.receives;
      else return; // ping
      render();
    };
    es.onerror = function () {
      connected = false;
      render();
      if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
    };
  }

  setInterval(function () {
    if (Date.now() - lastMessageAt > STALE_MS) {
      connected = false;
      render();
      connect();
    }
  }, 5000);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - lastMessageAt > 12000) connect();
  });

  setLocked(true);
  showView();
  connect();
})();
</script>
</body>
</html>
